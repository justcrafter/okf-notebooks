services:
  okf-notebooks:
    # Tag equals the package version; never `latest`. To use a locally built image instead:
    #   docker build -t okf-notebooks:0.1.0 .  &&  OKF_NOTEBOOKS_IMAGE=okf-notebooks:0.1.0 docker compose up -d
    image: ${OKF_NOTEBOOKS_IMAGE:-ghcr.io/justcrafter/okf-notebooks:0.1.0}
    container_name: okf-notebooks
    user: "${OKF_NOTEBOOKS_UID:-10001}:${OKF_NOTEBOOKS_GID:-10001}"  # owner of ./data
    restart: unless-stopped
    ports:
      - "127.0.0.1:8765:8765"   # reach it via a VPN (e.g. Tailscale) or a TLS reverse proxy, never a router port forward
    volumes:
      - ./data:/data
      - ./config:/config:ro
    environment:
      # Enables the Review UI (served on the same port). Unset = UI disabled.
      OKF_NOTEBOOKS_UI_PASSWORD: ${OKF_NOTEBOOKS_UI_PASSWORD:-}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
