[project]
name = "okf-notebooks"
version = "0.1.0"
description = "Shared agent notebooks MCP server over OKF Markdown bundles"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Andrey Kazakov", email = "public@kazakov.dev" }]
keywords = ["mcp", "model-context-protocol", "notebooks", "agents", "okf", "markdown", "git"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.2",
  "starlette>=0.37",
  "uvicorn>=0.30",
  "pydantic>=2",
  "pyyaml>=6",
  "ruamel.yaml>=0.18",
  "filelock>=3.12",
  "typer>=0.12",
]

[project.scripts]
okf-notebooks = "okf_notebooks.cli:app"

[project.urls]
Homepage = "https://github.com/justcrafter/okf-notebooks"
Repository = "https://github.com/justcrafter/okf-notebooks"
Issues = "https://github.com/justcrafter/okf-notebooks/issues"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/okf_notebooks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
