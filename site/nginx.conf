# Included inside the http {} block of nginx-unprivileged.

# Fingerprinted CSS can be cached forever; everything else revalidates after 5 minutes.
map $uri $cache_control {
    ~^/css/  "public, max-age=31536000, immutable";
    default  "public, max-age=300";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Behind a TLS reverse proxy: keep redirects relative so they don't leak :8080 or http://.
    absolute_redirect off;
    server_tokens off;

    charset utf-8;
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml text/plain;

    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /ru/ {
        error_page 404 /ru/404.html;
        try_files $uri $uri/ =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
